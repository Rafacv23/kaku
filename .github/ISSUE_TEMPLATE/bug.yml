name: Bug
description: Something in the app does not work as it should
labels: [needs-triage]
body:
  - type: textarea
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
    validations:
      required: true
  - type: input
    attributes:
      label: Browser and device
      placeholder: Firefox 143 on Android
